name: update-stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh README stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "alencristen"
          git config user.email "299997878+alencristen@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: refresh stats" && git push)
